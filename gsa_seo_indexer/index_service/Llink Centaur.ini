
[setup]
;default settings
;shutdown on 1. of october
enabled=0

;name of this service (default is ini file name)
name=Link Centaur

;where can we register/get more details?
main url=https://www.linkcentaur.com/hop?aff_token=bea9c
;api - http://www.linkcentaur.com/api

;how would you describe this service
desc=High Performance Backlink Indexing Service.

;a rating of this service from 1-5
rating=3

;how much does this cost
costs=10USD/month

;******************************************************************************
[index]

url=http://www.linkcentaur.com/api/newlinks.json
post_data=apikey=%API-Key%&campaign=%arg2%&%Drip_Feed_Option%&links=%arg1%
encoding=urlencode

url_devider=|

ok reply=status":"ok"


;minimum/maximum of urls to send
min amount=10

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"status":"ok","details":"ok"}
simulate_error={"status":"error","details":"unknown error"}

;******************************************************************************

[error_message]
front="details":
front2="
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service


[Drip_Feed_Option]
hint=Do you want to send links delayed?
type=combobox
list=disabled=disabled=Disabled|drip_x_days=2=Index within 2 Days|drip_x_days=10=Index within 10 Days|drip_x_days=20=Index within 20 Days|drip_x_days=30=Index within 30 Days|drip_x_days=50=Index within 50 Days|drip_x_days=100=Index within 100 Days|drip_x_links_per_day=10=Index 10 Links a Day|drip_x_links_per_day=100=Index 100 Links a Day|drip_x_links_per_day=500=Index 500 Links a Day
default=disabled=Disabled
