
[setup]

enabled=1
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://www.indexceptional.com/
;api - https://www.indexceptional.com/api-documentation/

;how would you describe this service
desc=Get URLs crawled faster - See every Googlebot visit


;a rating of this service from 1-5
rating=3

;how much does this cost
costs=0.48USD/URL

;******************************************************************************
[index]

;Use Basic Auth with your API key as the username and the string “password” as the password.
url=https://%API-Key%:password@www.indexceptional.com/wp-json/index/api/v1/order

post_data={"urls":["%arg1%],"product_id": 1234,"validated": %Validate_URLs%}


encoding=json

url_devider=","

;what should be taken as a good reply?
ok reply="success"

;minimum/maximum of urls to send
max amount=500

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"success":true,"data":{"order_id":12345,"status":"api-ordered","total_urls": %url_count%,"credits_charged":0,"credits_remaining":777,"view_order_url":"https://www.gsa-online.de/product/captcha_breaker","urls":[{"url":"https://www.gsa-online.de/","date_created":"2026-07-15","status":"queued","bot_ip": "-"}]}}
simulate_error={"code":"unknown_error","message":"Unknown Errror (CB Reply)","data":{"status":500}}

;******************************************************************************

[error_message]
front="message"
front2="
back="
remove html=1

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=


[Validate_URLs]
type=combobox
list=true=Yes|false=No
default=false
