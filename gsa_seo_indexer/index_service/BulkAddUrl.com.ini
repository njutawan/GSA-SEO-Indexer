
[setup]
;down according to cherub
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://bulkaddurl.com/bonus/45408
;api - http://bulkaddurl.com/user/api/

;how would you describe this service
desc=should be one of the more expensive services

;a rating of this service from 1-5
rating=3

;how much does this cost
costs=0.02USD / URL

;******************************************************************************
[index]

url=http://bulkaddurl.com/api/addurl
post_data=apikey=%API-Key%&name=%arg2%&urls=%arg1%
encoding=urlencode

url_devider=\n

;what should be taken as a good reply?
ok reply="status":"success"

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"taskId":925856,"taskPrice":0.001,"taskCountUrls":999,"taskUrlsAdded":["http:\/\/sample-link-from-gsa-emulation.com"],"status":"success","message":"task_id:925856","errorId":0}
simulate_error={"status":"error","message":"unknown error","errorId":1}

[balance]

url=http://bulkaddurl.com/api/getBalance
post_data=apikey=%API-Key%&cmd=remaininglimit
encoding=urlencode

;what should be taken as a good reply?
ok reply="balance":

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"balance":999999,"errorId":0}
simulate_error={"balance":0,"errorId":1}


;******************************************************************************

[error_message]
front="errorId":
back=,|}|\n
translate_result_1000=Request to API made with method which does not exist
translate_result_1001=Parameter with such value is impossible
translate_result_1002=Some error
translate_result_1100=Mysql error
translate_result_200=Account authorization key not found in the system
translate_result_201=You have not sent Account authorization key
translate_result_202=Account authorization key is bad
translate_result_301=No task with such id
translate_result_302=You are not owner of this task
translate_result_303=You have not sent task id
translate_result_304=Unknown task status
translate_result_305=No unique urls in task after checking hashes
translate_result_101=Service temporarily under construction

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service
