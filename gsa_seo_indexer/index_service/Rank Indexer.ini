
[setup]
;seems down
enabled=0

;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://en.rankindexer.win/?ref=3

;how would you describe this service
desc=Effective indexing links 

;a rating of this service from 1-5
rating=5

;how much does this cost
costs=10USD/month

;******************************************************************************
[index]

url=http://www.rankindexer.win/api.php
post_data=apikey=%API-Key%&cmd=submit&campaign=%arg2%&dripfeed=%Days_to_Index%&urls=%arg1%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
ok reply=OK

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

;******************************************************************************

[error_message]
front=Error:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=combobox
list=disabled=Disabled|2_Days=Index within 2 Days|5_Days=Index within 5 Days|10_Days=Index within 10 Days|15_Days=Index within 15 Days|20_Days=Index within 20 Days|25_Days=Index within 25 Days|30_Days=Index within 30 Days
default=disabled