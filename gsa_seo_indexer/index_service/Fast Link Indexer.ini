
[setup]
;down according to cherub
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://fastlinkindexer.com/
;api - http://linkprocessor.net/user/api_doc.php

;how would you describe this service
desc=Servicio de indexacion de Backlinks

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=9USD/month

;******************************************************************************
[index]

url=http://fastlinkindexer.com/api.php
post_data=apikey=%API-Key%&urls=%arg1%
encoding=urlencode

url_devider=\n

;ok reply=ok


;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=successfully created
simulate_error=Array\n(\n)\n{"error":"unknown error","message":"unknown error"}

;******************************************************************************

[error_message]
front="error":
;|"message":
front2="
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

