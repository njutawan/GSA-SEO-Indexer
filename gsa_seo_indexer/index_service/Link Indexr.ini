
[setup]
;down according to cherub
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://linkindexr.info/
;api - http://linkindexr.info/linkindexr-api/

;how would you describe this service
desc=service is kind of slow

;a rating of this service from 1-5
rating=1

;how much does this cost
costs=14USD/month

;******************************************************************************
[index]

url=http://linkindexr.info/api.php
post_data=apikey=%API-Key%&campaign=%arg2%&dripfeed=%Days_to_Index%&urls=%arg1%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
ok reply=Successfully Added

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

;******************************************************************************

[error_message]
front=Error:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=combobox
list=instant=Disabled|2_days=Index within 2 Days|5_days=Index within 5 Days|10_days=Index within 10 Days|15_days=Index within 15 Days|20_days=Index within 20 Days|25_days=Index within 25 Days|30_days=Index within 30 Days
default=instant
