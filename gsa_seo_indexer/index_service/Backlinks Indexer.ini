
[setup]
;cloudflare error
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://jvz7.com/c/65549/31395
;api - https://backlinksindexer.com/api/

;how would you describe this service
desc=Trusted as the #1 Indexer Since 2011

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=30USD/month

;******************************************************************************
[index]

url=https://backlinksindexer.com/%Method%.php
post_data=key=%API-Key%&urls=%arg1%
encoding=urlencode

url_devider=\n

;what should be taken as a good reply?
ok reply=success

;when simulating this service, use the following replies...
simulate_result=success
simulate_error=failed

;******************************************************************************

[error_message]
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Method]
type=combobox
list=api=Drip Fed Indexing (slow, optimal results)|boosterApi=Power Booster (very fast)
hint=Booster = This New Power Booster is designed for those stubborn links you need indexed as quickly as possible.
default=api
