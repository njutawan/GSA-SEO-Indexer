
[setup]

enabled=1
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://rapidurlindexer.com/?campaign=8
;api - https://rapidurlindexer.com/indexing-api/

;how would you describe this service
desc=Index Your Links With Our Backlink Indexing Service


;a rating of this service from 1-5
rating=3

;how much does this cost
costs=25USD/500 URLs

;******************************************************************************
[index]

url=https://rapidurlindexer.com/wp-json/api/v1/projects
post_data={"project_name": "%arg2%", "urls": ["%arg1%"],"notify_on_status_change": %get_email_notification%}
encoding=json

header=X-API-Key: %API-Key%

url_devider=","

;what should be taken as a good reply?
ok reply=successful|submitted

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"message": "Project created successfully","project_id": 123}
simulate_error={"message": "Unknown Error"}

;******************************************************************************

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Get_Email_Notification]
type=combobox
list=false=No|true=Yes
default=false

