
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://smartindexer.net/
;api - https://smartindexer.net/smartindexerapi.pdf

;how would you describe this service
desc=FAST AND EFFECTIVE INDEXATION

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=8.49USD/month

;******************************************************************************
[index]

url=https://smartindexer.net/api.php
post_data=apikey=%API-Key%&cmd=submit&campaign=%arg2%&urls=%arg1%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
ok reply=OK

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

[balance]

url=https://smartindexer.net/api.php
post_data=apikey=%API-Key%&cmd=remaininglimit
encoding=urlencode

;what should be taken as a good reply?
ok reply=[0-9]*

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=9999999
simulate_error=ERROR: unknown error


;******************************************************************************

[error_message]
front=Error:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

