
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://www.expressindexer.solutions/
;http://www.expressindexer.solutions/affiliates/idevaffiliate.php?id=102

;how would you describe this service
desc=

;a rating of this service from 1-5
rating=1

;how much does this cost
costs=27USD/month

;******************************************************************************
[index]

url=http://www.expressindexer.solutions/api.php
post_data=apikey=%API-Key%&urls=%arg1%
encoding=urlencode

url_devider=\n

;what should be taken as a good reply?
ok reply="status":"200"

;minimum/maximum of urls to send
min amount=10

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"status":"200"}
simulate_error={"status":"400","content":"Bad Request"}

;******************************************************************************
[error_message]
front=content":"
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service
