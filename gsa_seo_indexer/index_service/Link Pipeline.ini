
[setup]
;seems down
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://gsahro.linkpipe.hop.clickbank.net/
;api - http://www.linkpipeline.com/lp/member.api.php

;how would you describe this service
desc=Trusted as the #1 Indexer Since 2011

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=27USD/month

;******************************************************************************
[index]

url=http://www.linkpipeline.com/api/
post_data=key=%API-Key%&cmd=submit-urls&urls=%arg1%
encoding=urlencode

url_devider=\n

ok reply=1006

;minimum/maximum of urls to send

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"success": 1, "response_code": 1006, "quota": 999}
simulate_error={"success": 0, "response_code": 1005, "quota": 0}

;******************************************************************************

[error_message]
front=response_code"
front2=:
back=\n|,|}
translate_result_1001=API Key was not set! You did not enter an API key at all.
translate_result_1002=Command not set. Use cmd. You didn't tell the API what to do.
translate_result_1003=Wrong API Key! Auth Failed. You need to enter a valid API key for an active Linkpipeline member. Note: if the user's Linkpipeline account does not have an active subscription, their API key will fail.
translate_result_1004=URLs not set. The urls field hasn't been sent or it's empty. Use appropriate URLs with http:// included. Example: http://www.myblogsite.com.
translate_result_1005=No link has been submitted. Reason: you posted too many URLs in advance.
translate_result_1006=All the links have been submitted successfully. Congrats!
translate_result_1007=Cmd not recognized. See above for examples of cmd functions. example: submit-urls
remove=1006

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service
