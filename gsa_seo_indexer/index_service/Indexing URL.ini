
[setup]

enabled=1
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://www.indexingurl.com/
;api - https://www.indexingurl.com/dashboard/apiShowUser

;how would you describe this service
desc=Submit Urls Indexed Just 30 secs No Wait A Day

;a rating of this service from 1-5
rating=3

;how much does this cost
costs=3USD/100 URLs

;******************************************************************************
[index]

url=https://www.indexingurl.com/api/v1/submit
post_data={"urls":["%arg1%"]}
encoding=json

header=Authorization: Bearer %API-Key%

url_devider=","


;minimum/maximum of urls to send
min amount=1
max amount=100


;what should be taken as a good reply?
ok reply="success":true|"success": true

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"success":true, "submitted": %url_count%,"apiLimit": 999,"apiUsed": 2,"remaining": 999,"message": "URLs submitted successfully"}
simulate_error={"success": false,"message": "Unknown Error"}

;******************************************************************************

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service


[error_message]
front=message":
back=,|}
remove="
