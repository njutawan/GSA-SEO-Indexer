
[setup]
;default settings
enabled=0
;down

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://www.linkhuggers.com/goaff.php?ref=10

;how would you describe this service
desc=dead service

;a rating of this service from 1-5
rating=1

;how much does this cost
;costs=10USD/month

;******************************************************************************
[index]

url=http://api.linkhuggers.com/projects.php
post_data=api=%API-Key%&campaign=%arg2%&urls=%arg1%&dripfeed=%Days_to_Index%
encoding=urlencode

url_front="
url_back="
url_devider=,

;we have no idea what ok reply might be...service down
;ok reply=successfully created

;minimum/maximum of urls to send
min amount=10
max amount=10000

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

;******************************************************************************

[error_message]
front=ERROR:
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=number
min=1
max=30
hint=How many days shout it take to get this index?
default=2
