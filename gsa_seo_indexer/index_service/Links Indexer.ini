
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://linksindexer.com/?via=gsa
;api - https://linksindexer.com/api-documentation

;how would you describe this service
desc=Powerful and Reliable Backlinks Indexer

;a rating of this service from 1-5
rating=3

;how much does this cost
costs=10USD/month + Free Plan

;******************************************************************************
[index]

url=https://linksindexer.com/api/campaign/create
post_data=api_token=%API-Key%&campaign_name=%arg2%&urls=%arg1%&dripfeed=%Days_to_Index%

encoding=urlencode

url_devider=|

;in case the campaign cant be empty
default campaign=GSA

;what should be taken as a good reply?
ok reply="success": true|"success":true

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"success":true,"message":"GSA simulated"}
simulate_error={"success":false,"message":"Unknown Error"}

;******************************************************************************

[error_message]
front=message":
front2="
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=combobox
list=0=Disabled|1=Index within 1 Day|2=Index within 2 Days|5=Index within 5 Days|10=Index within 10 Days|15=Index within 15 Days
default=1