
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://www.omegaindexer.com/amember/aff/go/gsahro
;api - https://www.omegaindexer.com/api-integration/

;how would you describe this service
desc=The Alpha & Omega of Indexing


;a rating of this service from 1-5
rating=3

;how much does this cost
costs=10USD/1000 Links

;******************************************************************************
[index]

url=https://www.omegaindexer.com/amember/dashboard/api
post_data=apikey=%API-Key%&campaignname=%arg2%&dripfeed=%Days_to_Index%&urls=%arg1%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
ok reply="success":true

;when simulating this service, use the following replies...
simulate_result={"success":true}
simulate_error={"apikey":"secred.removed.by.GSA","dripfeed":1,"campaignName_err":"unknown error sorry","success":false}

;******************************************************************************

[error_message]
front=_err":"
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=combobox
list=0=Disabled|2=Index within 2 Days|5=Index within 5 Days|10=Index within 10 Days|15=Index within 15 Days|20=Index within 20 Days|25=Index within 25 Days|30=Index within 30 Days
default=2