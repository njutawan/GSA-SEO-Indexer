
[setup]
;default settings
enabled=0

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://witchindexer.com/
;api - http://witchindexer.com/user/api_doc.php

;how would you describe this service
desc=dead one

;a rating of this service from 1-5
rating=1

;how much does this cost
;costs=10USD/month

;******************************************************************************
[index]

url=http://witchindexer.com/api.php
post_data=apikey=%API-Key%&urls=%arg1%&dripfeed=%Days_to_Index%
encoding=urlencode

url_devider=\n

ok reply=successfully created

;minimum/maximum of urls to send
min amount=10
max amount=10000

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=successfully created
simulate_error=ERROR: unknown error

;******************************************************************************

[error_message]
front=ERROR:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service


[Days_to_Index]
type=combobox
list=0_Days=Disabled|2_Days=Index within 2 Days|5_Days=Index within 5 Days|10_Days=Index within 10 Days|15_Days=Index within 15 Days|20_Days=Index within 20 Days|25_Days=Index within 25 Days|30_Days=Index within 30 Days
default=2_Days