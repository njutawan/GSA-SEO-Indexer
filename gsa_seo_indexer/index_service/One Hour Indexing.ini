
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://onehourindexing.co/?idev_id=16
;api - linklicious.co/content/linklicious-api.pdf

;how would you describe this service
desc=One of the oldest indexing services alife

;a rating of this service from 1-5
rating=5

;how much does this cost
costs=9USD/month

;set it to other than zero than ''
default project name=GSA

;******************************************************************************
[index]

url=http://onehourindexing.co/api/uploadlinks?AppId=ccc126a3-66d9-49e7-992b-167b87463e62&ApiKey=%API-Key%&BatchName=%arg2%&LinksPerDay=%Links_Per_Day%

post_data=%arg1%
encoding=plain

url_devider=\n

ok reply=LinksAdded|"Error":false

;minimum/maximum of urls to send
min amount=10
max amount=10000

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={LinksAdded: %url_count%, LinksRejected: 0, RejectedLinks: [""], BatchId: "1"}
simulate_error={"Error":true,"ErrorMessage":"unknown error"}

;******************************************************************************
[balance]

url=http://onehourindexing.co/api/getremaining?AppId=ccc126a3-66d9-49e7-992b-167b87463e62&ApiKey=%API-Key%
encoding=plain


ok reply=Remaining

;minimum/maximum of urls to send
min amount=10
max amount=10000

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"Remaining":9999}
simulate_error={"Error":true,"ErrorMessage":"unknown error"}

[error_message]
front=<html|ErrorMessage"|ErrorMessage
front2=<head>|:|=
front3=<title>|"|null
back="|</title>|}

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Links_Per_Day]
type=number
min=1
max=99999999
hint=How many links you would like it to GET indexed per day? You can of course send more per day to the indexer, just that it will try to index them later.
default=20
