
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://aff.innocoders.com/idevaffiliate.php?id=1001_2_3_1
;api - http://www.indexification.com/developerapi.php

;how would you describe this service
desc=A BACKLINK NOT INDEXED IS SIMPLY A WASTE

;a rating of this service from 1-5
rating=5

;how much does this cost
costs=18USD/month

;******************************************************************************
[index]

url=http://www.indexification.com/api.php
post_data=apikey=%API-Key%&campaign=%arg2%&dripfeed=%Drip_Feed_Option%&urls=%arg1%
encoding=urlencode

url_devider=|

ok reply=ok

;minimum/maximum of urls to send
min amount=10

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

;******************************************************************************

[error_message]
front=ERROR:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Drip_Feed_Option]
hint=Do you want to send links delayed?
type=combobox
list=disabled=Disabled|2_days=Index within 2 Days|10_days=Index within 10 Days|20_days=Index within 20 Days|30_days=Index within 30 Days|50_days=Index within 50 Days|100_days=Index within 100 Days|10_links=Index 10 Links a Day|100_links=Index 100 Links a Day|500_links=Index 500 Links a Day
default=disabled