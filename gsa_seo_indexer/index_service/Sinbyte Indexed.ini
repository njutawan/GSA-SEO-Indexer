
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://sinbyte.com/

;how would you describe this service
desc=Best indexing, more than other services

;a rating of this service from 1-5
rating=3

;how much does this cost
costs=8,95USD

;******************************************************************************
[index]

url=https://app.sinbyte.com/api/indexing/
post_data={"apikey": "%API-Key%", "name": "%arg2%", "dripfeed": %dripfeed%, "urls": ["%arg1%"]}
encoding=json

header=Authorization: {'Content-Type': 'application/json'}

url_devider=","

ok reply=Succeed|"ok"

;when simulating this service, use the following replies...
simulate_result=All URLs successfully submitted to indexer service.
simulate_error=ERROR: No more credits for today!

;******************************************************************************

[error_message]
front1="message":
front2="
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[DripFeed]
type=combobox
list=0=No|1=Yes
default=1
