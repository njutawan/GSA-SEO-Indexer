
[setup]

enabled=1
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://2index.ninja/?from=4389&utm_source_from=gsa
;api - https://2index.ninja/api-documentation

;how would you describe this service
desc=Index Your Links With Our Backlink Indexing Service


;a rating of this service from 1-5
rating=3

;how much does this cost
costs=25USD/500 URLs

;******************************************************************************
[index]

url=https://2index.ninja/api/v1/link/add_simple
post_data=project_name=%arg2%&links[]=%arg1%&google=%index_in_google%&yandex=%index_in_yandex%&bing=%index_in_bing%
encoding=urlencode

header=Authorization: Bearer %API-Key%

url_devider=&links[]=

;what should be taken as a good reply?
ok reply="success":true|"success": true

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"success": true,"errors": ["You sent invalid links"],"invalid_links": []}
simulate_error={"success": false,"errors": ["Failed to create the project"]}

;******************************************************************************

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Index_in_Google]
type=combobox
list=1=Yes|0=No
default=1

[Index_in_Bing]
type=combobox
list=1=Yes|0=No
default=1

[Index_in_Yandex]
type=combobox
list=1=Yes|0=No
default=0

