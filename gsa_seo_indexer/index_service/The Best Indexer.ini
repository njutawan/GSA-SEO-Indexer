
[setup]
;default settings
enabled=0

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://thebestindexer.com/
;api - manual doc file :(

;how would you describe this service
desc=Get your links crawled

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=49USD/month

;******************************************************************************
[index]

url=%Private_URL%
post_data=file=%arg1%&submit=submit


encoding=multipart

url_devider=\n

max amount=10000

;what should be taken as a good reply?
ok reply=WE START PROCESSING

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=<html><head></head><body>WE START PROCESSING</body></html>
simulate_error=<html><head></head><body><div class="feedback">Unable to accept your files for now, sorry!</div></body></html>

;******************************************************************************

[error_message]
front=<div class="feedback">
back=</

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[Private_URL]
type=text
hint=You Private URL should look like: https://thebestindexer.com/paypalday/1234567890-1234567890-1234567890
