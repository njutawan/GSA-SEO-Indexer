
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://web20indexer.com/login-singup.php?ref=41
;api - http://web20indexer.com/api-documentation.html

;how would you describe this service
desc=Boost Your links with EliteLinkIndexer


;a rating of this service from 1-5
rating=3

;how much does this cost
costs=5USD/month

;******************************************************************************
[index]

url=https://web20indexer.com/api.php
;debug url - http://web20indexer.com/apitest.php

post_data=apikey=%API-Key%&cmd=submit&campaign=%arg2%&dripfeed=%Days_to_Index%&urls=%arg1%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
ok reply=OK

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

;******************************************************************************

[error_message]
front=Error:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=combobox
list=disabled=Disabled|2=Index within 2 Days|5=Index within 5 Days|10=Index within 10 Days|15=Index within 15 Days|20=Index within 20 Days|25_days=Index within 25 Days|30=Index within 30 Days
default=disabled