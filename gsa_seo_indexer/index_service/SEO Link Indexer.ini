
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://seolinkindexer.com?reference=GSAHRO
;api - https://seolinkindexer.com/user/get-api-documents

;how would you describe this service
desc=SEO Link Indexer for Google

;a rating of this service from 1-5
rating=5

;how much does this cost
costs=1USD

;******************************************************************************
[index]

url=https://seolinkindexer.com/api/v1
post_data=action=url-submit&key=%API-Key%&name=%arg2%&dripfeed_days=%Days_to_Index%&links=%arg1%

encoding=urlencode

url_devider=\n

ok reply="success":

;minimum/maximum of urls to send
min amount=1
max amount=10000

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"success":"Links submitted successfully!"}
simulate_error={"error":"Unknown Error"}

;******************************************************************************

[error_message]
front="error":
front2="
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=number
min=1
max=30
hint=How many days shout it take to get this index?
default=2
