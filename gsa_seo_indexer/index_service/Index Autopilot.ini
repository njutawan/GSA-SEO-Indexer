
[setup]
;down according to cherub
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://indexautopilot.com/
;api - https://indexautopilot.com/public/homepage/api/

;how would you describe this service
desc=EASILY Shove YOUR Links Into Google's Index

;a rating of this service from 1-5
rating=3

;how much does this cost
costs=17USD/month

;******************************************************************************
[index]

url=https://indexautopilot.com/api

post_data=key=%API-Key%&project=%arg2%&drip=%Days_to_Index%&urls=%arg1%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
;ok reply=OK

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=Error unknown error

;******************************************************************************

[error_message]
front=Error|"Api Key Not Found. 
back=\n|"

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=number
min=0
max=30
default=0
