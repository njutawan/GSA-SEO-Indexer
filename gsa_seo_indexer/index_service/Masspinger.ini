
[setup]
;very unstable
enabled=1

;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://masspinger.com/

;how would you describe this service
desc=Free indexing yservice 

;a rating of this service from 1-5
rating=5

;how much does this cost
costs=FREE

;******************************************************************************
[index]

url=https://masspinger.com/api/bulk-ping-urls.php
post_data={"urls":["%arg1%"]}

encoding=json

url_devider=","

;minimum/maximum of urls to send
min amount=1
max amount=100


;what should be taken as a good reply?
ok reply="success": true|"success":true

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"results":[{"id":"123","status_code": 200,"response_time": 494,"success": true,"error_message": null}]}
simulate_error={"results":[{"id":"123","status_code": 200,"response_time": 494,"success": false,"error_message": "Unknown Error"}]}

;******************************************************************************

[error_message]
front=error_message":
back=,|}
remove="
