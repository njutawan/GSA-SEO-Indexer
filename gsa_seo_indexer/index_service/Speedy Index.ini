
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://t.me/SpeedyIndexBot?start=605727077

;how would you describe this service
desc=SpeedyIndexBot - service to speed up sites indexing

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=5USD/1000URLs

;in case the campaign cant be empty
default campaign=GSA

;******************************************************************************
[index]

url=https://api.speedyindex.com/v1/task/create
post_data={"title": "%arg2%", "urls": ["%arg1%"]}
encoding=json

header=Authorization: %API-Key%

url_devider=","

ok reply=code":0

;when simulating this service, use the following replies...
simulate_result={"code":0,"task_id":"12345678901234567890"}
simulate_error={"code":500, "message":"Unknown Error"}
;******************************************************************************

[error_message]
front="message":"
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

