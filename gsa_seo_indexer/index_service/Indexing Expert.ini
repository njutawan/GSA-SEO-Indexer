
[setup]

enabled=1
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://indexingexpert.com/
;api - https://indexingexpert.com/api-docs

;how would you describe this service
desc=Index Your Links With Our Backlink Indexing Service


;a rating of this service from 1-5
rating=3

;how much does this cost
costs=10USD/month

;******************************************************************************
[index]

url=https://indexingexpert.com/api/v1
post_data={"key": "%API-Key%","action": "add","service": 1,"link": ["%arg1%"],"ordertype": "%Index_Type%","priority": "%Priority%"}


encoding=json

url_devider=","

;what should be taken as a good reply?
ok reply="success"

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"status": "success","order number": 999,"remaining balance": "99.99"}
simulate_error={"status":"failed","errors":{"key":["Internal Error."],"action":["Internal Error."]}}

;******************************************************************************

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Index_Type]
type=combobox
list=Fresh Index|Re-Index
default=Fresh Index

[Priority]
type=combobox
list=Normal|Urgent
default=1Normal
