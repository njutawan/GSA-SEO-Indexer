
[setup]

enabled=1
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://honestindexer.com/
;api - https://honestindexer.com/api-doc/

;how would you describe this service
desc=bring back the magic of Google indexing, just like in its golden days


;a rating of this service from 1-5
rating=3

;how much does this cost
costs=10USD/5000 URLs

;******************************************************************************
[index]

url=https://honestindexer.com/api
post_data=apikey=%API-Key%&urls=%arg1%
encoding=urlencode


url_devider=|

;what should be taken as a good reply?
ok reply="success": true|"success":true

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"success": true,"inserted":%url_count%,"remaining_credits":999}
simulate_error={"success": false,"error": "Internal server error." }

;******************************************************************************

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service
