
[setup]
;default settings
enabled=0
;seems down....waiting for reply from owner -> redirect to random site

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://www.fastindexerpro.com
;api - http://portal.fastindexerpro.com/api-docs.php

;how would you describe this service
desc=down

;a rating of this service from 1-5
rating=1

;how much does this cost
;costs=17USD/month

;******************************************************************************
[index]

url=http://www.fastindexerpro.com/api.php
post_data=apikey=%API-Key%&urls=%arg1%&dripfeed=%Drip_Feed_Option%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
ok reply=OK

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

;******************************************************************************

[error_message]
front=ERROR:
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Drip_Feed_Option]
hint=Do you want to send links delayed?
type=combobox
list=disabled=Disabled|2_days=Index within 2 Days|10_days=Index within 10 Days|20_days=Index within 20 Days|30_days=Index within 30 Days
default=disabled