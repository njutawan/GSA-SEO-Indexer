
[setup]
;seems down
enabled=1

;default settings

;name of this service (default is ini file name)
name=NeuralIndexer

;where can we register/get more details?
main url=https://forum.gsa-online.de/discussion/34690/official-neuralindexer-smart-indexing-service-gsa-ser-integrated-0-0084-link/p1

;how would you describe this service
desc=Free indexing yservice 

;a rating of this service from 1-5
rating=5

;how much does this cost
costs=

