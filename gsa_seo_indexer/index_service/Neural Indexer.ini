[index]

url=https://ivoque.de/api/link-submit.php
post_data={"api_key":"%api-key%","engine":"%engine%","fast_index":%fast_index%,"partner":"4C4402EC8C","links": ["%arg1%"]}

encoding=json

url_devider=","

;minimum/maximum of urls to send
min amount=1
max amount=100


;what should be taken as a good reply?
ok reply="status": "success"|"status":"success"

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"status":"success","result":{"processed": 3,"accepted": 3,"charged_amount": 0.0252,"balance": 9.9748}}
simulate_error={"status": "insufficient","details": { "required": 0.0252, "balance": 0.01 }}

;******************************************************************************

[error_message]
front=status":
back=,|}
remove="


[API-Key]
type=text
hint=API-KEY to access the service

[Engine]
type=combobox
list=universal|yandex
default=universal

[fast_index]
type=combobox
list=true=Yes (0.50 USD per link)|false=No (0.0084 USD per link)
default=false