
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://gindex.me/en/?ref=1633
;api - based on http://www.instantlinkindexer.com/apidocs.php - with different ip
;http://gindex.me/en/api.html

;how would you describe this service
desc=Absolutely Whitehat and 100% Safe Google Approved Methods!

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=14USD/month

;******************************************************************************
[index]

url=http://gindex.me/api.php
post_data=apikey=%API-Key%&cmd=submit&campaign=%arg2%&dripfeed=%Days_to_Index%&urls=%arg1%
encoding=urlencode

url_devider=|

;what should be taken as a good reply?
ok reply=OK

;minimum/maximum of urls to send
min amount=1
max amount=50

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=OK
simulate_error=ERROR: unknown error

[balance]

url=http://gindex.me/api.php
post_data=apikey=%API-Key%&cmd=remaininglimit
encoding=urlencode

;what should be taken as a good reply?
ok reply=[0-9]*

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result=9999999
simulate_error=ERROR: unknown error


;******************************************************************************

[error_message]
front=Error:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service

[Days_to_Index]
type=combobox
list=0_Days=Disabled|2_Days=Index within 2 Days|5_Days=Index within 5 Days|10_Days=Index within 10 Days|15_Days=Index within 15 Days|20_Days=Index within 20 Days|25_Days=Index within 25 Days|30_Days=Index within 30 Days
default=2_Days