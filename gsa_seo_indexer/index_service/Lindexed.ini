
[setup]
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://www.lindexed.com/
;api - http://www.lindexed.com/api.php

;how would you describe this service
desc=One of the oldest indexing services alife

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=15USD/month

;******************************************************************************
[index]

url=http://www.lindexed.com/api/api.php
post_data=apikey=%API-Key%&serviceid=%arg2%&urls=%arg1%
encoding=urlencode

;in case the campaign cant be empty
default campaign=GSA

url_devider=|

ok reply=OK|Successfully added

;minimum/maximum of urls to send
min amount=10
max amount=10000

;when simulating this service, use the following replies...
simulate_result=<br><b>Campaign ID 1234567 created, Now importing urls...</b><br><br><b><FONT COLOR="#04B404">Successfully added </FONT></b>http://some-sample-url-from-gsa-simulation.com/<br><b>Finished creating the campaign 1234567 with 999 unique urls in <b>00</b> minutes and <b>01</b> seconds....</b><br>
simulate_error=ERROR: No more credits for today!

;******************************************************************************

'At least 10 unique urls should be sent per call.<br>'
[error_message]
front=ERROR:|At least 10 unique|Invalid API|This user doesn't
back=\n|<br>
translate_result_urls should be sent per call.=Error - Less than 10 unique URLs
translate_result_key.=Error - Invalid API Key
translate_result_have an active subscription.=Error - Invalid API Key

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service
