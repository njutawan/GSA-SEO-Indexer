
[setup]
;down according to cherub
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=http://xindexer.com/
;api http://xindexer.com/apiScripts/xin_api_scripts.txt

;how would you describe this service
desc=belongs to SENuke!?

;a rating of this service from 1-5
rating=1

;how much does this cost
;costs=18USD/month

;******************************************************************************
[index]

url=http://xindexer.com/xinmember/api/xin-add/
post_data=_key=%password%&login=%login%%arg1%
encoding=urlencode

url_front=&urls%5B%nr%%5D=
url_devider=

ok reply="ok":true

;minimum/maximum of urls to send
min amount=10

;when simulating this service, use the following replies...
;not idea if reply is correct
simulate_result={"ok":true,"error":false,"message":"all fine"}
simulate_error={"ok":false,"error":true,"message":"unknown error"}

;******************************************************************************

[error_message]
front=message":"
back="

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[Login]
type=text
hint=Login data for your account

[Password]
type=password
hint=Login data for your account
