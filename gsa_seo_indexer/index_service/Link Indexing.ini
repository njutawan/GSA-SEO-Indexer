
[setup]
;seems down
enabled=0
;default settings

;name of this service (default is ini file name)
;name=

;where can we register/get more details?
main url=https://linkindexing.net/
;api - https://linkindexing.net/submitLink

;how would you describe this service
desc=Premium Link Indexing Service

;a rating of this service from 1-5
rating=4

;how much does this cost
costs=180USD/month

;******************************************************************************
[index]

url=https://linkindexing.net/api.php
post_data=api_key=%API-Key%&cmd=submit&campaign_name=%arg2%&dripfeed=%Days_to_Index%&link=%arg1%&reporturl=1&method=regular
encoding=urlencode
;post_data={"apikey":"%API-Key%","cmd":"submit","campaign":"%arg2%","dripfeed":"%Days_to_Index%","urls":"%arg1%"}
;encoding=json

url_devider=|

;what should be taken as a good reply?
ok reply=SUCCESS:OK

;when simulating this service, use the following replies...
simulate_result=SUCCESS:OK (URL Count: %url_count%)
simulate_error=ERROR:wrong data sent

;******************************************************************************

[error_message]
front=ERROR:
back=\n

;******************************************************************************
;input variables (defined by 'type=...')
;******************************************************************************

[API-Key]
type=text
hint=API-KEY to access the service


[Days_to_Index]
type=combobox
list=0=Disabled|2_days=Index within 2 Days|5_days=Index within 5 Days|10_days=Index within 10 Days|15_days=Index within 15 Days|20_days=Index within 20 Days|25_days=Index within 25 Days|30_days=Index within 30 Days
default=0