name: Release

# Publishing is driven by a tag, never by a branch push:
#   1. bump the version in pyproject.toml (and gsa_seo_indexer/engine.py)
#   2. git tag v1.3.0 && git push origin v1.3.0
# The workflow builds the sdist + wheel, checks the metadata, and uploads with
# PyPI *trusted publishing* (OIDC) - there is no API token stored anywhere.
# On PyPI, add this repository + workflow as a trusted publisher for the
# project "gsa-seo-indexer" (environment: pypi).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only (no upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2" "twine>=5"

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Check the wheel contents (data files, entry point)
        run: python tools/check_package.py

      - name: Install the wheel and smoke-test it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/gsa-seo-indexer --version
          /tmp/venv/bin/gsa-seo-indexer sites --count
          /tmp/venv/bin/gsa-seo-indexer services --list | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gsa-seo-indexer
    permissions:
      id-token: write   # trusted publishing: no password, no token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
