name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "ruff>=0.6"
          # tomllib baru ada di 3.11; tomli membuat test metadata tetap jalan di 3.10
          pip install "tomli; python_version < '3.11'"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log

      # Logs sit behind a storage host that some networks cannot reach, while
      # annotations are served by the API - so every failure is echoed as an
      # annotation, which is also what the pull-request view shows.
      - name: Turn test failures into annotations
        if: failure()
        run: |
          grep -E "^(FAIL|ERROR):|^[A-Za-z_.]*Error:|^Ran [0-9]+ test|^-*$" /tmp/tests.log \
            | grep -vE "^-+$" | tail -30 | while IFS= read -r line; do
              echo "::error::$line"
            done

      - name: CLI smoke test
        run: |
          python -m gsa_seo_indexer.cli --version
          python -m gsa_seo_indexer.cli sites --count
          python -m gsa_seo_indexer.cli services --list

  package:
    name: Wheel contains the runtime data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # setuptools tidak lagi ikut di env baru (3.12+); tools/check_package.py
          # memakainya untuk build tanpa isolasi
          pip install "build>=1.2" "setuptools>=68" "tomli; python_version < '3.11'"

      - name: Build sdist + wheel
        run: python -m build

      - name: Check wheel contents
        run: python tools/check_package.py

      - name: Install the wheel and run the CLI from site-packages
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/gsa-seo-indexer --version
          /tmp/venv/bin/gsa-seo-indexer sites --count
          /tmp/venv/bin/gsa-seo-indexer services --list | head -3
