[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsa-seo-indexer"
version = "1.2.0"
description = "Re-implementation of the GSA SEO Indexer v3.09 mechanism: submit URLs to thousands of high-crawl statistics/whois sites so search engines discover them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["seo", "indexing", "backlinks", "gsa", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# Standard library only — no third-party runtime dependencies.
dependencies = []

[project.scripts]
gsa-seo-indexer = "gsa_seo_indexer.cli:main"

[project.optional-dependencies]
# Development only; the runtime package still has zero dependencies.
dev = ["ruff>=0.6"]

[tool.setuptools]
packages = ["gsa_seo_indexer"]

[tool.setuptools.package-data]
gsa_seo_indexer = ["data/*", "index_service/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
# Ghidra/decompiler scratch scripts kept as evidence, not product code.
extend-exclude = ["reverse_engineering_evidence"]

[tool.ruff.lint]
# Errors and dead code only (pyflakes + a few pycodestyle checks).  Style
# churn is not worth a dependency; these are the rules that found real bugs
# (an undefined name in the emulator, unused imports after refactors).
select = ["E4", "E7", "E9", "F"]
